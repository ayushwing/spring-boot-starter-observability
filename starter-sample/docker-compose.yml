version: '3.8'

# Full observability stack for the sample application.
# Usage:
#   docker compose up -d
#   curl http://localhost:8080/api/products
#   Open Jaeger:    http://localhost:16686
#   Open Grafana:   http://localhost:3000  (admin / admin)
#   Open Prometheus: http://localhost:9090

services:

  # ── Application ──────────────────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: starter-sample/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: observability-sample
      OBSERVABILITY_TRACING_ENDPOINT: http://jaeger:4317
      OBSERVABILITY_LOGGING_FORMAT: json
      OBSERVABILITY_LOGGING_INCLUDE_REQUEST_INFO: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus,metrics
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
    depends_on:
      jaeger:
        condition: service_healthy
      prometheus:
        condition: service_started
    restart: on-failure
    networks:
      - observability

  # ── Distributed Tracing — Jaeger ─────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - observability

  # ── Metrics — Prometheus ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - observability

  # ── Dashboards — Grafana ──────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.3
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - observability

networks:
  observability:
    driver: bridge

volumes:
  grafana-data:
